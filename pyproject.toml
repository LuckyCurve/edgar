[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar"
version = "0.1.0"
description = "SEC EDGAR data for agents: filings, XBRL facts, sections, proxies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lxml>=6.1.3"]

[project.scripts]
edgar = "edgar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
